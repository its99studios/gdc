name: GDC Latest

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gdc-latest-release
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Development Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing version tag
        id: version
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v[0-9]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit already has a version tag. Skipping development release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update latest tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Get short commit SHA
        if: steps.version.outputs.skip != 'true'
        id: commit
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Publish GDC Latest
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GDC Latest
          body: |
            Development release for commit [`${{ steps.commit.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            This is a **development release**, meaning it is **likely not tested** and **you should only download it for testing the plugin.**
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
